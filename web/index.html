<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14120f">
<title>Finanzas</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="iconos/icono-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Finanzas">

<link rel="stylesheet" href="css/estilos.css">
</head>
<body>

<div class="grano" aria-hidden="true"></div>

<!-- ================================================================
     Movimientos
     ================================================================ -->
<main id="pantalla-app" class="app">

  <header class="cabecera">

    <div class="mes">
      <button id="mes-anterior" class="mes__flecha" aria-label="Mes anterior">‹</button>
      <h2 id="mes-actual" class="mes__nombre"></h2>
      <button id="mes-siguiente" class="mes__flecha" aria-label="Mes siguiente">›</button>
    </div>

    <button id="abrir-ajustes" class="salir" title="Ajustes" aria-label="Ajustes">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none"
           stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1L7 17M17 7l2.1-2.1"/>
      </svg>
    </button>

  </header>

  <section class="balance">

    <p class="balance__etiqueta">Balance del mes</p>
    <p id="balance-total" class="balance__cifra">—</p>

    <div class="balance__detalle">
      <div class="balance__parte">
        <span class="punto punto--ingreso"></span>
        <span class="balance__nombre">Ingresos</span>
        <span id="balance-ingresos" class="balance__valor">—</span>
      </div>
      <div class="balance__parte">
        <span class="punto punto--gasto"></span>
        <span class="balance__nombre">Gastos</span>
        <span id="balance-gastos" class="balance__valor">—</span>
      </div>
    </div>

  </section>

  <nav class="filtros" aria-label="Filtrar por tipo">
    <button class="filtro filtro--activo" data-tipo="">Todo</button>
    <button class="filtro" data-tipo="gasto">Gastos</button>
    <button class="filtro" data-tipo="ingreso">Ingresos</button>
  </nav>

  <section id="lista" class="lista" aria-live="polite"></section>

  <button id="nuevo" class="fab" aria-label="Nuevo movimiento">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="none"
         stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <path d="M12 5v14M5 12h14"/>
    </svg>
  </button>

</main>


<!-- ================================================================
     Ajustes
     ================================================================ -->
<main id="pantalla-ajustes" class="app" hidden>

  <header class="cabecera">
    <button id="volver" class="mes__flecha" aria-label="Volver">‹</button>
    <h2 class="mes__nombre" style="min-width:auto">Ajustes</h2>
    <span style="flex:1"></span>
  </header>

  <section class="bloque">

    <h3 class="bloque__titulo">Copia de seguridad</h3>

    <p class="bloque__nota" id="estado-copia">
      Tus datos están solo en este dispositivo.
    </p>

    <button id="exportar" class="boton boton--principal">
      Descargar copia
    </button>

    <button id="elegir-archivo" class="boton boton--fantasma"
            style="width:100%;margin:10px 0 0">
      Restaurar desde un archivo
    </button>

    <input type="file" id="archivo" accept="application/json,.json" hidden>

  </section>

  <section class="bloque">

    <h3 class="bloque__titulo">Categorías</h3>

    <p class="bloque__nota">
      Toca una para cambiarle el nombre.
    </p>

    <div id="lista-categorias"></div>

    <button id="nueva-categoria" class="boton boton--fantasma"
            style="width:100%;margin:12px 0 0">
      Añadir categoría
    </button>

  </section>

  <section class="bloque">

    <h3 class="bloque__titulo">Medios de pago</h3>

    <div id="lista-medios"></div>

    <button id="nuevo-medio" class="boton boton--fantasma"
            style="width:100%;margin:12px 0 0">
      Añadir medio de pago
    </button>

  </section>

  <section class="bloque">
    <h3 class="bloque__titulo">Sobre la aplicación</h3>
    <p class="bloque__nota" id="sobre"></p>
  </section>

</main>


<!-- ================================================================
     Formulario de movimiento
     ================================================================ -->
<div id="velo" class="velo" hidden></div>

<section id="hoja" class="hoja" hidden aria-modal="true" role="dialog">

  <form id="form-movimiento" class="hoja__form">

    <div class="hoja__asa" aria-hidden="true"></div>

    <div class="hoja__cabecera">
      <h3 id="hoja-titulo" class="hoja__titulo">Nuevo movimiento</h3>
      <button type="button" id="cerrar-hoja" class="hoja__cerrar"
              aria-label="Cerrar">×</button>
    </div>

    <div class="tipo" role="radiogroup" aria-label="Tipo de movimiento">
      <button type="button" class="tipo__opcion tipo__opcion--activa"
              data-tipo="gasto">Gasto</button>
      <button type="button" class="tipo__opcion" data-tipo="ingreso">Ingreso</button>
    </div>

    <label class="monto">
      <span class="monto__signo">€</span>
      <input type="text" id="monto" name="monto" inputmode="decimal"
             placeholder="0,00" required>
    </label>

    <label class="campo">
      <span class="campo__etiqueta">Concepto</span>
      <input type="text" id="descripcion" name="descripcion"
             maxlength="255" placeholder="Compra semanal">
    </label>

    <label class="campo">
      <span class="campo__etiqueta">Categoría</span>
      <select id="subcategoria" name="subcategoria_id" required></select>
    </label>

    <div class="fila">

      <label class="campo">
        <span class="campo__etiqueta">Fecha</span>
        <input type="date" id="fecha" name="fecha" required>
      </label>

      <label class="campo">
        <span class="campo__etiqueta">Pago</span>
        <select id="medio-pago" name="medio_pago_id"></select>
      </label>

    </div>

    <label class="campo">
      <span class="campo__etiqueta">Nota</span>
      <textarea id="comentario" name="comentario" rows="2"
                placeholder="Opcional"></textarea>
    </label>

    <p id="form-error" class="error" hidden></p>

    <div class="hoja__acciones">
      <button type="button" id="eliminar" class="boton boton--peligro" hidden>
        Eliminar
      </button>
      <button type="submit" class="boton boton--principal">Guardar</button>
    </div>

  </form>

</section>

<div id="aviso" class="aviso" hidden></div>

<script src="js/datos.js"></script>
<script src="js/copia.js"></script>
<script src="js/app.js"></script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {
        // Sin service worker la aplicación funciona igual; solo
        // deja de poder abrirse sin conexión.
      });
    });
  }
</script>
</body>
</html>
