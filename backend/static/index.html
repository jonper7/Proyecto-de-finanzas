<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Finanzas</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/static/iconos/icono-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Finanzas">

<link rel="stylesheet" href="/static/css/estilos.css">
</head>
<body>

<div class="grano" aria-hidden="true"></div>

<!-- ================================================================
     Acceso
     ================================================================ -->
<section id="pantalla-login" class="login">

  <div class="login__marca">
    <span class="login__cifra">€</span>
    <h1 class="login__titulo">Finanzas</h1>
    <p class="login__sub">Control de gastos personales</p>
  </div>

  <form id="form-login" class="login__form" autocomplete="on">

    <label class="campo">
      <span class="campo__etiqueta">Correo</span>
      <input type="email" name="email" inputmode="email"
             autocomplete="username" required>
    </label>

    <label class="campo">
      <span class="campo__etiqueta">Contraseña</span>
      <input type="password" name="password"
             autocomplete="current-password" required>
    </label>

    <p id="login-error" class="error" hidden></p>

    <button type="submit" class="boton boton--principal">Entrar</button>

  </form>

</section>


<!-- ================================================================
     Aplicación
     ================================================================ -->
<main id="pantalla-app" class="app" hidden>

  <header class="cabecera">

    <div class="mes">
      <button id="mes-anterior" class="mes__flecha" aria-label="Mes anterior">‹</button>
      <h2 id="mes-actual" class="mes__nombre"></h2>
      <button id="mes-siguiente" class="mes__flecha" aria-label="Mes siguiente">›</button>
    </div>

    <button id="sync" class="sync" title="Sincronizar ahora">—</button>

    <button id="abrir-resumen" class="salir" title="Resumen"
            aria-label="Resumen" style="margin-right:8px">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none"
           stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
        <path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>
      </svg>
    </button>

    <button id="salir" class="salir" title="Cerrar sesión" aria-label="Cerrar sesión">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none"
           stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <path d="M15 4h3a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-3"/>
        <path d="M10 8l-4 4 4 4"/><path d="M6 12h9"/>
      </svg>
    </button>

  </header>

  <section class="balance">

    <p class="balance__etiqueta">Balance del mes</p>
    <p id="balance-total" class="balance__cifra">—</p>

    <div class="balance__detalle">
      <div class="balance__parte">
        <span class="punto punto--ingreso"></span>
        <span class="balance__nombre">Ingresos</span>
        <span id="balance-ingresos" class="balance__valor">—</span>
      </div>
      <div class="balance__parte">
        <span class="punto punto--gasto"></span>
        <span class="balance__nombre">Gastos</span>
        <span id="balance-gastos" class="balance__valor">—</span>
      </div>
    </div>

  </section>

  <nav class="filtros" aria-label="Filtrar por tipo">
    <button class="filtro filtro--activo" data-tipo="">Todo</button>
    <button class="filtro" data-tipo="gasto">Gastos</button>
    <button class="filtro" data-tipo="ingreso">Ingresos</button>
  </nav>

  <section id="lista" class="lista" aria-live="polite"></section>

  <button id="nuevo" class="fab" aria-label="Nuevo movimiento">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="none"
         stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <path d="M12 5v14M5 12h14"/>
    </svg>
  </button>

</main>


<!-- ================================================================
     Resumen
     ================================================================ -->
<main id="pantalla-resumen" class="app app--ancha" hidden>

  <header class="cabecera">
    <button id="volver-resumen" class="mes__flecha" aria-label="Volver">‹</button>
    <div class="mes">
      <button id="res-anterior" class="mes__flecha" aria-label="Mes anterior">‹</button>
      <h2 id="res-mes" class="mes__nombre"></h2>
      <button id="res-siguiente" class="mes__flecha" aria-label="Mes siguiente">›</button>
    </div>
    <span style="flex:1"></span>
  </header>

  <div class="tarjetas">
    <div class="tarjeta tarjeta--ingreso">
      <p class="tarjeta__etiqueta">Ingresos</p>
      <p class="tarjeta__cifra" id="kpi-ingresos">—</p>
      <p class="tarjeta__pie" id="kpi-ingresos-n">—</p>
    </div>
    <div class="tarjeta tarjeta--gasto">
      <p class="tarjeta__etiqueta">Gastos</p>
      <p class="tarjeta__cifra" id="kpi-gastos">—</p>
      <p class="tarjeta__pie" id="kpi-gastos-n">—</p>
    </div>
    <div class="tarjeta tarjeta--balance">
      <p class="tarjeta__etiqueta">Balance</p>
      <p class="tarjeta__cifra" id="kpi-balance">—</p>
      <p class="tarjeta__pie" id="kpi-balance-pie">—</p>
    </div>
  </div>

  <section class="bloque">
    <h3 class="bloque__titulo">En qué se va el dinero</h3>
    <p class="bloque__nota">Gasto del mes por categoría.</p>
    <div id="por-categoria"></div>
  </section>

  <section class="bloque">
    <h3 class="bloque__titulo">Últimos seis meses</h3>
    <p class="bloque__nota">Ingresos y gastos de cada mes.</p>
    <div id="evolucion"></div>
  </section>

  <section class="bloque">
    <h3 class="bloque__titulo">Mayores gastos del mes</h3>
    <div id="top-gastos"></div>
  </section>

</main>


<!-- ================================================================
     Formulario
     ================================================================ -->
<div id="velo" class="velo" hidden></div>

<section id="hoja" class="hoja" hidden aria-modal="true" role="dialog">

  <form id="form-movimiento" class="hoja__form">

    <div class="hoja__asa" aria-hidden="true"></div>

    <div class="hoja__cabecera">
      <h3 id="hoja-titulo" class="hoja__titulo">Nuevo movimiento</h3>
      <button type="button" id="cerrar-hoja" class="hoja__cerrar"
              aria-label="Cerrar">×</button>
    </div>

    <div class="tipo" role="radiogroup" aria-label="Tipo de movimiento">
      <button type="button" class="tipo__opcion tipo__opcion--activa"
              data-tipo="gasto">Gasto</button>
      <button type="button" class="tipo__opcion" data-tipo="ingreso">Ingreso</button>
    </div>

    <label class="monto">
      <span class="monto__signo">€</span>
      <input type="text" id="monto" name="monto" inputmode="decimal"
             placeholder="0,00" required>
    </label>

    <label class="campo">
      <span class="campo__etiqueta">Concepto</span>
      <input type="text" id="descripcion" name="descripcion"
             maxlength="255" placeholder="Compra semanal">
    </label>

    <label class="campo">
      <span class="campo__etiqueta">Categoría</span>
      <select id="subcategoria" name="subcategoria_id" required></select>
    </label>

    <div class="fila">

      <label class="campo">
        <span class="campo__etiqueta">Fecha</span>
        <input type="date" id="fecha" name="fecha" required>
      </label>

      <label class="campo">
        <span class="campo__etiqueta">Pago</span>
        <select id="medio-pago" name="medio_pago_id"></select>
      </label>

    </div>

    <label class="campo">
      <span class="campo__etiqueta">Nota</span>
      <textarea id="comentario" name="comentario" rows="2"
                placeholder="Opcional"></textarea>
    </label>

    <p id="form-error" class="error" hidden></p>

    <div class="hoja__acciones">
      <button type="button" id="eliminar" class="boton boton--peligro" hidden>
        Eliminar
      </button>
      <button type="submit" class="boton boton--principal">Guardar</button>
    </div>

  </form>

</section>

<div id="aviso" class="aviso" hidden></div>

<script src="/static/js/db.js"></script>
<script src="/static/js/api.js"></script>
<script src="/static/js/sync.js"></script>
<script src="/static/js/resumen.js"></script>
<script src="/static/js/app.js"></script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("/sw.js").catch(() => {
        // Sin service worker la aplicación funciona igual; solo
        // deja de poder abrirse sin conexión.
      });
    });
  }
</script>
</body>
</html>
