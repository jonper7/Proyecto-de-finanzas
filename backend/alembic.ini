# Configuración de Alembic para Finanzas Personales.
#
# La URL de conexión NO se define aquí: se construye en alembic/env.py
# a partir de app.core.config.settings (es decir, del archivo .env).

[alembic]
script_location = alembic
prepend_sys_path = .

# Los archivos de migración se nombran con la fecha, para que el
# listado quede ordenado cronológicamente.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Sin 'timezone': se usa la hora local. Definirla exige el paquete
# 'tzdata', que Windows no trae de serie.

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
